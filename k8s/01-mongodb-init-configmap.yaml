apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: flask-demo
data:
  01-create-app-user.sh: |
    #!/bin/bash
    set -eo pipefail

    echo "==> Running MongoDB first-time app user initialization..."

    if [ -n "$MONGO_APP_USERNAME" ] && [ -n "$MONGO_APP_PASSWORD" ]; then
      APP_DB="${MONGO_INITDB_DATABASE:-flask_db}"
      echo "Creating user '$MONGO_APP_USERNAME' on database '$APP_DB'..."

      mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin <<EOF
      use $APP_DB;

      if (!db.getUser('$MONGO_APP_USERNAME')) {
        db.createUser({
          user: '$MONGO_APP_USERNAME',
          pwd: '$MONGO_APP_PASSWORD',
          roles: [
            { role: 'readWrite', db: '$APP_DB' }
          ]
        });
        print("Application user '$MONGO_APP_USERNAME' created successfully with readWrite permissions on '$APP_DB'.");
      } else {
        print("Application user '$MONGO_APP_USERNAME' already exists.");
      }
    EOF
    else
      echo "MONGO_APP_USERNAME or MONGO_APP_PASSWORD not set. Skipping."
    fi

